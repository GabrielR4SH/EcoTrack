<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Leaf / Eco Icon -->
  <g transform="translate(8, 10)">
    <!-- Main leaf shape -->
    <path d="M30 5 
             C45 5, 58 18, 58 35 
             C58 52, 45 60, 30 60 
             C22 60, 15 52, 12 42
             C8 30, 12 15, 30 5Z" 
          fill="#0D9488"/>
    
    <!-- Leaf vein -->
    <path d="M30 12 
             Q38 28, 36 48" 
          stroke="#F0FDFA" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Small side veins -->
    <path d="M30 22 Q42 26, 48 22" stroke="#F0FDFA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M30 34 Q40 38, 46 35" stroke="#F0FDFA" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Small circular accent (tracking / CO2 idea) -->
    <circle cx="48" cy="18" r="7" fill="#22C55E" opacity="0.95"/>
    <circle cx="48" cy="18" r="3.5" fill="#F0FDFA"/>
  </g>
  
  <!-- Text EcoTrack -->
  <text x="85" y="52" 
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="36" 
        font-weight="700" 
        fill="#0F766E"
        letter-spacing="-0.5">
    EcoTrack
  </text>
  
  <!-- Small tagline -->
  <text x="88" y="70" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="500" 
        fill="#14B8A6"
        letter-spacing="1.2">
    SUSTAINABILITY TRACKING
  </text>
</svg>
