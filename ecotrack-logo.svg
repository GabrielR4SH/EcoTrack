<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;display=swap');
      
      .bg { fill: #254838; }
      .leaf-green { fill: #7cb83e; }
      .leaf-gray { fill: #e2e4e0; }
      .text-eco {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif;
        font-weight: 900;
        font-size: 130px;
        fill: #e2e4e0;
        letter-spacing: 6px;
      }
      .text-track {
        font-family: 'Playfair Display', 'Georgia', serif;
        font-weight: 700;
        font-size: 82px;
        fill: #7cb83e;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="800" class="bg" />

  <!-- Grupo do Logotipo (Folhas) -->
  <g id="leaves">
    <!-- Folha Esquerda (Verde) -->
    <path class="leaf-green" d="M 392,282 C 370,210 332,138 308,88 C 298,98 282,130 282,175 C 282,238 340,276 392,282 Z" />
    
    <!-- Nervura da Folha Esquerda -->
    <path d="M 392,282 C 344,232 315,168 309,102" fill="none" stroke="#254838" stroke-width="5.5" stroke-linecap="round" />

    <!-- Folha Direita (Cinza/Branco) -->
    <path class="leaf-gray" d="M 405,325 C 390,250 425,140 510,72 C 550,140 542,235 405,325 Z" />
    
    <!-- Nervura da Folha Direita -->
    <path d="M 405,325 C 418,240 452,145 500,82" fill="none" stroke="#254838" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- Textos -->
  <g id="typography">
    <!-- Texto ECO -->
    <text x="400" y="435" text-anchor="middle" class="text-eco">ECO</text>
    
    <!-- Texto Track -->
    <text x="400" y="522" text-anchor="middle" class="text-track">Track</text>
  </g>
</svg>

