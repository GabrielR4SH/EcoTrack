services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ecotrack-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ecotrack
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: ecotrack-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ecotrack
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: ecotrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecotrack
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ecotrack
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - ecotrack-mysql-data:/var/lib/mysql
    networks:
      - ecotrack

  node:
    image: node:22-alpine
    container_name: ecotrack-node
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
    ports:
      - "5173:5173"
    networks:
      - ecotrack
    command: sh -c "npm install && npm run dev -- --host"
    profiles:
      - frontend

networks:
  ecotrack:
    driver: bridge

volumes:
  ecotrack-mysql-data:
    driver: local